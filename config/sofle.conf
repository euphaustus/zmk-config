# Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB per-key lighting (underglow driver covers per-key on Sofle Choc)
CONFIG_ZMK_RGB_UNDERGLOW=y

# Keep RGB and ext_power independent — prevents RGB toggle from
# also cutting power to other peripherals
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Bluetooth
CONFIG_BT=y
CONFIG_BT_MAX_PAIRED=5
