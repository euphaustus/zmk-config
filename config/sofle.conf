# Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB per-key lighting (underglow driver covers per-key on Sofle Choc)
CONFIG_ZMK_RGB_UNDERGLOW=n

# Keep RGB and ext_power independent — prevents RGB toggle from
# also cutting power to other peripherals
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Bluetooth
CONFIG_BT=y
# MAX_CONN and MAX_PAIRED must be n+1 where n = number of BT profiles
# because the two keyboard halves consume one connection slot between them
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
